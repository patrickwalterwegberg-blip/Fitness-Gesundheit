name: KI-Bot bereitstellen
on:
  push:
    branches: [main]
    paths:
      - 'backend/supabase/functions/team-assistant/**'
      - 'backend/supabase/functions/_shared/**'
      - '.github/workflows/team-assistant.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: team-assistant-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ftcurcqduzrxsvkujfql
      TEAMHUB_SITE_URL: https://patrickwalterwegberg-blip.github.io/Fitness-Gesundheit/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Einrichtung prüfen
        run: node -e "if(!process.env.SUPABASE_ACCESS_TOKEN)throw Error('SUPABASE_ACCESS_TOKEN fehlt als GitHub Actions Secret')"
      - run: npm ci --no-audit --no-fund
      - run: npm run test:db
      - run: npm run test:assistant
      - name: Rücksprungadresse setzen
        run: npx --yes supabase@2.122.1 --workdir backend secrets set TEAMHUB_SITE_URL="$TEAMHUB_SITE_URL" --project-ref "$SUPABASE_PROJECT_REF"
      - name: KI-Dienst veröffentlichen
        run: npx --yes supabase@2.122.1 --workdir backend functions deploy team-assistant --no-verify-jwt --use-api --project-ref "$SUPABASE_PROJECT_REF"
